name: Android

on:
  push:
    branches: "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycloneDDS_android:
    name: Release arm64-v8a (build only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        name: Repository Checkout
      - name: configure
        # Use the Android NDK preinstalled on the runner. No host IDLC or
        # Android OpenSSL build is needed for this compile-only check.
        # API 28 provides pthread_attr_setinheritsched; keep NDK warnings non-fatal.
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_IDLC=OFF \
            -DBUILD_DDSPERF=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DENABLE_SSL=OFF \
            -DWERROR=OFF
      - name: build
        run: cmake --build build --parallel
