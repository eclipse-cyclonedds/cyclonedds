sample:
  name: Cyclone DDS
  description: Creates a DDS domain and participant and reads it back from the DCPSParticipant built-in topic
tests:
  sample.cyclonedds.selftest:
    tags:
      - dds
      - net
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    harness: console
    harness_config:
      type: one_line
      regex:
        - "cyclonedds: self-test passed"
    timeout: 60
