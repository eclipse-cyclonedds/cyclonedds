CONFIG_CYCLONEDDS=y

CONFIG_MAIN_STACK_SIZE=65536
CONFIG_THREAD_NAME=y
CONFIG_POSIX_THREAD_THREADS_MAX=12
CONFIG_MAX_PTHREAD_MUTEX_COUNT=300
CONFIG_MAX_PTHREAD_COND_COUNT=150
CONFIG_ZVFS_POLL_MAX=8

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=5
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=5
CONFIG_NET_TC_RX_COUNT=0
CONFIG_NUM_COOP_PRIORITIES=0

CONFIG_NET_TX_STACK_SIZE=32768
CONFIG_NET_RX_STACK_SIZE=32768
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=512
CONFIG_NET_BUF_TX_COUNT=256
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
