# Overlay for experimental TCP as qemu_x86 with E1000

CONFIG_PCIE=y

#CONFIG_NET_SLIP_TAP=y
CONFIG_NET_L2_ETHERNET=y

CONFIG_NET_QEMU_ETHERNET=y
#CONFIG_NET_QEMU_SLIP=y
#CONFIG_NET_LOOPBACK=y

#CONFIG_ETHERNET_LOG_LEVEL_DBG=y

CONFIG_NET_IPV4_FRAGMENT=y
CONFIG_NET_IPV6_FRAGMENT=y

# Static address; use CONFIG_NET_DHCPV4=y instead if a DHCP server is available.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"

# With an MMU the default malloc arena is only 16 KiB; DDS needs considerably more.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608
# qemu_x86 maps only 8 MiB of kernel virtual memory by default, not enough for the above.
CONFIG_KERNEL_VM_SIZE=0x1000000
